<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating - DONO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/customer-shell.css">
<link rel="stylesheet" href="assets/css/customer-theme.css">

<script src="assets/js/components/feedback.js" defer></script><link rel="stylesheet" href="assets/css/customer-product-reference.css"></head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-light">
    <div class="text-center" id="loadingState">
        <div class="spinner-border text-primary mb-3" role="status"></div>
        <h5 class="fw-bold">Verifying Google Account</h5>
        <p class="text-muted small">Please wait...</p>
    </div>

    <div class="text-center d-none" id="errorState">
        <div class="alert alert-danger mx-auto" style="max-width: 400px;" id="errorMessage"></div>
        <a href="login.html" class="btn btn-primary btn-sm">Return to Login</a>
    </div>

    <script type="module">
        import { api } from './assets/js/services/api.js';

        async function verify() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');

            if (!code) {
                showError('Missing authorization code.');
                return;
            }

            try {
                const res = await api.post('/auth/google/callback', { code });
                if (res.data.requiresProfileCompletion) {
                    window.location.replace('complete-profile.html');
                } else {
                    window.location.replace(res.data?.user?.role === 'admin' ? 'admin/index.html' : 'products.html');
                }
            } catch (err) {
                showError(err.message || 'Authentication failed.');
            }
        }

        function showError(msg) {
            document.getElementById('loadingState').classList.add('d-none');
            const errBox = document.getElementById('errorState');
            errBox.classList.remove('d-none');
            document.getElementById('errorMessage').textContent = msg;
        }

        verify();
    </script>
</body>
</html>
