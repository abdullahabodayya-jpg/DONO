
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders | DONO</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/admin-orders.css?v=4">
</head>

<body>

    <main class="admin-orders-page">

        <header class="page-header">
            <span class="page-eyebrow">DONO ADMINISTRATION</span>
            <h1>Manage Orders</h1>
            <p>View, search and manage customer orders all in one place.</p>
        </header>

        <section class="orders-toolbar">

            <input
                type="search"
                id="order-search"
                placeholder="Search by order number or customer name..."
            >

            <div class="filter-box">
                <label for="status-filter">Status</label>

                <select id="status-filter">
                    <option value="all">All Status</option>
                    <option value="pending">Pending</option>
                    <option value="confirmed">Confirmed</option>
                    <option value="cancelled">Cancelled</option>
                </select>
            </div>

        </section>

        <section class="orders-table-wrapper">

            <table class="orders-table">

                <thead>
                    <tr>
                        <th class="col-order">
                            <button type="button" class="sort-btn" data-sort="order_number">
                                Order # ↕
                            </button>
                        </th>

                        <th class="col-customer">
                            <button type="button" class="sort-btn" data-sort="customer_name">
                                Customer ↕
                            </button>
                        </th>

                        <th class="col-date">
                            <button type="button" class="sort-btn" data-sort="created_at">
                                Date ↕
                            </button>
                        </th>

                        <th class="col-items">
                            <button type="button" class="sort-btn" data-sort="items">
                                Items ↕
                            </button>
                        </th>

                        <th class="col-total">
                            <button type="button" class="sort-btn" data-sort="total_amount">
                                Total ↕
                            </button>
                        </th>

                        <th class="col-status">
                            <button type="button" class="sort-btn" data-sort="status">
                                Status ↕
                            </button>
                        </th>

                        <th class="col-actions">Actions</th>
                    </tr>
                </thead>

                <tbody id="orders-table-body"></tbody>

            </table>

            <p id="no-orders" class="no-orders" hidden>
                No orders found.
            </p>

        </section>

        <div class="pagination-container">

            <p id="orders-count" class="orders-count"></p>

            <div class="pagination">
                <button type="button" id="prev-page">Previous</button>
                <span id="page-info">Page 1 of 1</span>
                <button type="button" id="next-page">Next</button>
            </div>

        </div>

    </main>

    <div class="modal-overlay" id="order-modal" hidden>

        <section class="order-modal">

            <div class="modal-header">

                <h2 id="modal-title">Order Details</h2>

                <button type="button" id="close-modal" class="close-modal">
                    &times;
                </button>

            </div>

            <div class="modal-content">

                <div class="details-column">

                    <h3>Customer Information</h3>
                    <p id="modal-customer"></p>

                    <h3>Order Information</h3>
                    <p id="modal-number"></p>
                    <p id="modal-date"></p>

                    <h3>Order Items</h3>
                    <div id="modal-items"></div>

                </div>

                <div class="details-column">

                    <h3>Order Summary</h3>

                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span id="modal-subtotal"></span>
                    </div>

                    <div class="summary-row">
                        <span>Discount</span>
                        <span id="modal-discount"></span>
                    </div>

                    <div class="summary-row">
                        <span>Shipping</span>
                        <span id="modal-shipping"></span>
                    </div>

                    <div class="summary-row summary-total">
                        <span>Total</span>
                        <span id="modal-total"></span>
                    </div>

                    <h3 class="update-heading">Update Order Status</h3>

                    <select id="modal-status">
                        <option value="pending">Pending</option>
                        <option value="confirmed">Confirmed</option>
                        <option value="cancelled">Cancelled</option>
                    </select>

                    <button type="button" id="save-status" class="save-btn">
                        Save Changes
                    </button>

                    <p id="status-message" class="status-message"></p>

                </div>

            </div>

        </section>

    </div>

    <script src="assets/js/admin-orders.js?v=3"></script>

</body>

</html>
