<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - DONO</title>

    <link rel="stylesheet" href="./assets/css/auth.css">
<link rel="stylesheet" href="assets/css/customer-shell.css">
<link rel="stylesheet" href="assets/css/customer-theme.css">

<script src="assets/js/components/feedback.js" defer></script><link rel="stylesheet" href="assets/css/customer-product-reference.css"></head>

<body>

    <div class="auth-container">

        <div class="auth-card register-card">

            <div class="auth-header">
                <h1>Create Account</h1>
                <p>Join DONO to start shopping</p>
            </div>

            <div class="alert-box error d-none" id="errorAlert"></div>

            <form id="registerForm" >

                <div class="form-group">
                    <label for="name">Full Name <span class="required">*</span></label>
                    <input
                        type="text"
                        id="name"
                        class="form-control"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address <span class="required">*</span></label>
                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="password">Password <span class="required">*</span></label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password <span class="required">*</span></label>
                        <input
                            type="password"
                            id="confirmPassword"
                            class="form-control"
                            placeholder="Confirm password"
                            required
                        >
                    </div>

                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                        >
                    </div>

                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" class="form-control">
                            <option value="">Select gender...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <textarea
                        id="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter your address"
                    ></textarea>
                </div>

                <button type="submit" class="btn-primary">
                    Create Account
                </button>

            </form>

            <div class="divider">
                <span>or sign up with</span>
            </div>

            <button type="button" class="google-btn" id="googleSignInBtn">

                <svg width="20" height="20" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>

                <span>Sign up with Google</span>

            </button>

            <div class="auth-footer">
                <p>
                    Already have an account?
                    <a href="login.html">Sign in here</a>
                </p>
            </div>

        </div>

    </div>

    <script type="module" src="./assets/js/userAuth.js"></script>

</body>
</html>
