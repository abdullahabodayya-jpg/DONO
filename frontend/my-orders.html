
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders | DONO</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/my-orders.css">
</head>

<body>

    <main class="orders-page">

        <header class="orders-header">
            <span class="orders-eyebrow">YOUR DONO ACCOUNT</span>

            <h1>My Orders</h1>

            <p>
                View your order history, track your gifts,
                and explore the details of every order.
            </p>
        </header>

        <section class="orders-section">

            <div class="orders-section-heading">
                <div>
                    <span class="orders-section-label">ORDER HISTORY</span>
                    <h2 id="orders-count">Your Orders (0)</h2>
                </div>
            </div>

            <div id="orders-list" aria-live="polite"></div>

            <div class="empty-orders" id="empty-orders" hidden>

                <div class="empty-orders-icon" aria-hidden="true">
                    ♡
                </div>

                <h3>No orders yet!</h3>

                <p>
                    Your orders will appear here once you
                    complete your first purchase.
                </p>

                <a href="index.html" class="btn btn-primary browse-gifts-btn">
                    Explore Gifts
                </a>

            </div>

        </section>

    </main>

    <script src="assets/js/my-orders.js"></script>

</body>

</html>
