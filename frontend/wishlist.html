
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Wishlist | DONO</title>

    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/wishlist.css">
</head>

<body>

    <main class="wishlist-page">

        <header class="wishlist-header">
            <h1>My Wishlist</h1>
            <p>Your favorite gifts, all in one place.</p>
        </header>


        <section class="wishlist-section">


            <h2 id="wishlist-count">Your Favorites (0)</h2>


            <div class="wishlist-grid" id="wishlist-grid">

            </div>



            <div class="empty-wishlist" id="empty-wishlist" hidden>
                <h3>Your wishlist is empty!</h3>
                <p>Save your favorite gifts to see them here.</p>
            </div>


               <p id="wishlist-message"></p>
        </section>

    </main>

    <script src="assets/js/wishlist.js"></script>

</body>

</html>
