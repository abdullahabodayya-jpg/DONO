
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Complete Profile - DONO</title>

    <link rel="stylesheet" href="./assets/css/auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-header">

                <span class="step-badge">Step 2 of 2</span>

                <h1>Complete Profile</h1>

                <p>Please provide the missing details</p>

            </div>

            <div class="alert-box error" id="errorAlert"></div>

            <form id="completeProfileForm" novalidate>

                <div class="form-group">
                    <label for="phone">
                        Phone Number <span class="required">*</span>
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        class="form-control"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="gender">
                        Gender <span class="required">*</span>
                    </label>

                    <select id="gender" class="form-control" required>
                        <option value="">Select gender...</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="address">
                        Delivery Address <span class="required">*</span>
                    </label>

                    <textarea
                        id="address"
                        class="form-control"
                        rows="3"
                        placeholder="Enter your delivery address"
                        required
                    ></textarea>
                </div>

                <button type="submit" class="btn-primary">
                    Save and Continue
                </button>

            </form>

        </div>

    </div>

    <script type="module" src="./assets/js/userAuth.js"></script>

</body>
</html>
