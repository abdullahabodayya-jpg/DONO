<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile - DONO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="d-flex align-items-center min-vh-100 bg-light py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-7 col-lg-5">
            <div class="card p-4 p-sm-5 border-0 shadow-sm rounded-4 bg-white">
                <div class="text-center mb-4">
                    <span class="badge bg-primary px-3 py-2 rounded-pill mb-2">Step 2 of 2</span>
                    <h3 class="fw-bold mb-1">Complete Profile</h3>
                    <p class="text-muted small">Please provide the missing details</p>
                </div>

                <div class="alert alert-danger py-2 small d-none" id="errorAlert"></div>

                <form id="completeProfileForm" novalidate>
                    <div class="mb-3">
                        <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="phone" required>
                    </div>

                    <div class="mb-3">
                        <label for="gender" class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                        <select class="form-select" id="gender" required>
                            <option value="">Select gender...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <label for="address" class="form-label fw-semibold">Delivery Address <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="address" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Save and Continue</button>
                </form>
            </div>
        </div>
    </div>
</div>
<script type="module" src="./assets/js/userAuth.js"></script>
</body>
</html>
